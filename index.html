<meta name="description" content="NO SAINTS HOME — independent music. All streaming platforms and social links in one place.">
<meta property="og:type" content="website">

<title>NO SAINTS HOME | Official Links</title>
<style>
:root { color-scheme:dark; }
* {box-sizing:border-box}
html {background:#050606}
body {margin:0; background:#050606; color:#f7f7f5; font:500 15px/1.4 Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased}
a {color:inherit}
main {max-width:740px; margin:auto; padding:26px 26px 55px}
.brand {display:block; max-width:575px; width:100%; height:auto; margin:0 auto;}
.header {border-bottom:1px solid #242725; padding:4px 0 18px}
.hero {display:flex; flex-direction:column; align-items:center; margin:12px 0 27px}
.cover {display:block; height:auto; width:min(92%,415px); margin:0 auto;}
.subtitle {color:#aaa; text-transform:uppercase;letter-spacing:.22em; font-size:10px; text-align:center; margin:8px 0 0}
.group {margin:25px 0 28px}
.h {display:flex; gap:13px; align-items:center; text-transform:uppercase; letter-spacing:.23em; font-size:12px; font-weight:700; margin:0 0 15px}
.h::after {content:""; flex:1; border-top:1px solid #2b2d2b}
.diamond {width:8px; height:8px; background:#ffdf24; display:inline-block; transform:rotate(45deg); flex:none}
.group.social .diamond {background:#fa2828}
.links {display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
.link {display:flex; justify-content:space-between; align-items:center; min-height:57px; padding:16px 17px; background:#111414; border:1px solid #292e2c; border-radius:10px; text-decoration:none; font-size:14px; font-weight:700; transition:border-color .2s,background .2s}
.link:hover,.link:focus-visible {background:#1a1e1c; border-color:#e7cf2e; outline:none}
.arrow {font-weight:400; color:#9ca39e; font-size:20px; line-height:1}
footer {display:flex; justify-content:space-between; gap:12px; padding-top:24px; margin-top:52px; border-top:1px solid #262927; color:#929691; font-size:10px; letter-spacing:.12em; text-transform:uppercase}
footer .s {color:#f5dc21}
@media(max-width:480px) {main {padding:17px 16px 32px}.header {padding:4px 0 12px}.cover {width:min(96%,355px)} .hero {margin:8px 0 20px}.links {gap:10px}.link {min-height:54px; font-size:13px; padding:13px}.group {margin:24px 0}footer {font-size:8px; margin-top:44px}}
@media(max-width:335px) {.links {grid-template-columns:1fr}}
</style>
